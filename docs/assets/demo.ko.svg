<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">같은 말, 며칠 뒤</title><desc id="d">설명용 예시예요. 같은 저장소, 같은 사람, 같은 말.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.line{stroke:#d0d7de}.card{fill:#f6f8fa}.cardS{stroke:#d0d7de}
.you{fill:#fff4dc}.sYou{stroke:#b07d00}.tYou{fill:#8a6100}
.ai{fill:#eee9ff}.sAi{stroke:#6e56cf}.tAi{fill:#5a43b8}
.ok{fill:#e2f5ea}.sOk{stroke:#1a7f4b}.tOk{fill:#1a7f4b}
.bad{fill:#ffebe9}.sBad{stroke:#cf222e}.tBad{fill:#cf222e}
.arrow{stroke:#8c959f;fill:none}.arrowHead{fill:#8c959f}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.line{stroke:#30363d}.card{fill:#161b22}.cardS{stroke:#30363d}
.you{fill:#2a2210}.sYou{stroke:#e3b341}.tYou{fill:#e3b341}
.ai{fill:#1d1838}.sAi{stroke:#a48bff}.tAi{fill:#b9a6ff}
.ok{fill:#0f2a1c}.sOk{stroke:#3fb96f}.tOk{fill:#3fb96f}
.bad{fill:#2d1215}.sBad{stroke:#ff7b72}.tBad{fill:#ff7b72}
.arrow{stroke:#6e7681}.arrowHead{fill:#6e7681}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif}
</style><rect class="bg" width="1200" height="470"/><text class="ink" x="40.0" y="52.0" font-size="28" font-weight="700" text-anchor="start">같은 말, 며칠 뒤</text><text class="mute" x="40.0" y="80.0" font-size="15" font-weight="400" text-anchor="start">설명용 예시예요. 같은 저장소, 같은 사람, 같은 말.</text><rect class="card cardS" x="40.0" y="108.0" width="540.0" height="330.0" rx="16" stroke-width="1.2"/><text class="ink" x="64.0" y="146.0" font-size="19" font-weight="700" text-anchor="start">처음</text><text class="mute" x="64.0" y="170.0" font-size="14" font-weight="400" text-anchor="start">"올려"가 나한테 무슨 뜻인지 아직 몰라요</text><rect class="you sYou" x="374.7" y="196.0" width="181.3" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="388.7" y="225.2" font-size="16" font-weight="400" text-anchor="start">README 고쳐서 올려</text><rect class="ai sAi" x="64.0" y="252.8" width="210.4" height="66.0" rx="14" stroke-width="1.2"/><text class="ink" x="78.0" y="282.0" font-size="16" font-weight="400" text-anchor="start">"올려"를 PR로 읽었어요.</text><text class="ink" x="78.0" y="305.2" font-size="16" font-weight="400" text-anchor="start">브랜치 만들고 PR 열게요.</text><rect class="you sYou" x="273.3" y="332.8" width="282.7" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="287.3" y="362.0" font-size="16" font-weight="400" text-anchor="start">아니, 여긴 내 fork라 main에 바로야</text><rect class="ok sOk" x="64.0" y="390.0" width="308.5" height="32.0" rx="16" stroke-width="1.2"/><text class="tOk" x="80.0" y="411.0" font-size="14" font-weight="700" text-anchor="start">기록</text><text class="ink" x="119.4" y="411.0" font-size="14" font-weight="400" text-anchor="start">[올려] → main에 바로 푸시 · @my-fork</text><rect class="card cardS" x="620.0" y="108.0" width="540.0" height="330.0" rx="16" stroke-width="1.2"/><text class="ink" x="644.0" y="146.0" font-size="19" font-weight="700" text-anchor="start">며칠 뒤</text><text class="mute" x="644.0" y="170.0" font-size="14" font-weight="400" text-anchor="start">서로 다른 3일에 같은 정정이 쌓인 다음</text><rect class="you sYou" x="954.7" y="196.0" width="181.3" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="968.7" y="225.2" font-size="16" font-weight="400" text-anchor="start">README 고쳐서 올려</text><rect class="ai sAi" x="644.0" y="252.8" width="392.6" height="66.0" rx="14" stroke-width="1.2"/><text class="ink" x="658.0" y="282.0" font-size="16" font-weight="400" text-anchor="start">"올려" = main에 바로 푸시 (이 저장소에서 배운 뜻).</text><text class="ink" x="658.0" y="305.2" font-size="16" font-weight="400" text-anchor="start">고치고 푸시했어요.</text><rect class="ok sOk" x="644.0" y="390.0" width="235.2" height="32.0" rx="16" stroke-width="1.2"/><text class="tOk" x="660.0" y="411.0" font-size="14" font-weight="700" text-anchor="start">확정</text><text class="ink" x="699.4" y="411.0" font-size="14" font-weight="400" text-anchor="start">묻지도, 틀리지도 않았어요</text><path class="arrow" d="M584 273 h28" stroke-width="2"/><path class="arrowHead" d="M612 267 l9 6 l-9 6 z"/></svg>
