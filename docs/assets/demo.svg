</style><rect class="bg" width="1200" height="470"/><text class="ink" x="40.0" y="52.0" font-size="28" font-weight="700" text-anchor="start">Same words, a few days later</text><text class="mute" x="40.0" y="80.0" font-size="15" font-weight="400" text-anchor="start">Illustrative. Same repo, same person, same words.</text><rect class="card cardS" x="40.0" y="108.0" width="540.0" height="330.0" rx="16" stroke-width="1.2"/><text class="ink" x="64.0" y="146.0" font-size="19" font-weight="700" text-anchor="start">Day one</text><text class="mute" x="64.0" y="170.0" font-size="14" font-weight="400" text-anchor="start">It doesn't know what "push it" means to you yet</text><rect class="you sYou" x="314.1" y="196.0" width="241.9" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="328.1" y="225.2" font-size="16" font-weight="400" text-anchor="start">fix the README and push it</text><rect class="ai sAi" x="64.0" y="252.8" width="235.7" height="66.0" rx="14" stroke-width="1.2"/><text class="ink" x="78.0" y="282.0" font-size="16" font-weight="400" text-anchor="start">Read "push it" as a PR.</text><text class="ink" x="78.0" y="305.2" font-size="16" font-weight="400" text-anchor="start">Opening a branch and a PR.</text><rect class="you sYou" x="248.3" y="332.8" width="307.7" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="262.3" y="362.0" font-size="16" font-weight="400" text-anchor="start">no, this is my fork. straight to main</text><rect class="ok sOk" x="64.0" y="390.0" width="402.5" height="32.0" rx="16" stroke-width="1.2"/><text class="tOk" x="80.0" y="411.0" font-size="14" font-weight="700" text-anchor="start">recorded</text><text class="ink" x="153.6" y="411.0" font-size="14" font-weight="400" text-anchor="start">[push it] → push straight to main · @my-fork</text><rect class="card cardS" x="620.0" y="108.0" width="540.0" height="330.0" rx="16" stroke-width="1.2"/><text class="ink" x="644.0" y="146.0" font-size="19" font-weight="700" text-anchor="start">A few days later</text><text class="mute" x="644.0" y="170.0" font-size="14" font-weight="400" text-anchor="start">after the same correction on 3 different days</text><rect class="you sYou" x="894.1" y="196.0" width="241.9" height="42.8" rx="14" stroke-width="1.2"/><text class="ink" x="908.1" y="225.2" font-size="16" font-weight="400" text-anchor="start">fix the README and push it</text><rect class="ai sAi" x="644.0" y="252.8" width="418.6" height="66.0" rx="14" stroke-width="1.2"/><text class="ink" x="658.0" y="282.0" font-size="16" font-weight="400" text-anchor="start">"push it" = straight to main (learned in this repo).</text><text class="ink" x="658.0" y="305.2" font-size="16" font-weight="400" text-anchor="start">Fixed and pushed.</text><rect class="ok sOk" x="644.0" y="390.0" width="301.2" height="32.0" rx="16" stroke-width="1.2"/><text class="tOk" x="660.0" y="411.0" font-size="14" font-weight="700" text-anchor="start">confirmed</text><text class="ink" x="739.9" y="411.0" font-size="14" font-weight="400" text-anchor="start">no question, no wrong guess</text><path class="arrow" d="M584 273 h28" stroke-width="2"/><path class="arrowHead" d="M612 267 l9 6 l-9 6 z"/></svg>
