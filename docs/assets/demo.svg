<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Same words, a few days later</title><desc id="d">Illustrative. Same repo, same person, same words.</desc><style>
