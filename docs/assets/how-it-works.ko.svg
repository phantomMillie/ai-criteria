<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">정정 한 번이 도는 길</title><desc id="d">고쳐 준 한마디가 다음 대화의 근거가 돼요.</desc><style>
