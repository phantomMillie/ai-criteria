</style><rect class="bg" width="1200" height="400"/><text class="ink" x="40.0" y="52.0" font-size="28" font-weight="700" text-anchor="start">정정 한 번이 도는 길</text><text class="mute" x="40.0" y="80.0" font-size="15" font-weight="400" text-anchor="start">고쳐 준 한마디가 다음 대화의 근거가 돼요.</text><rect class="you sYou" x="40.0" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tYou" x="58.0" y="152.0" font-size="17" font-weight="700" text-anchor="start">1 · 지시</text><text class="ink" x="58.0" y="188.0" font-size="14" font-weight="400" text-anchor="start">"README 고쳐서 올려"</text><path class="arrow" d="M246.2 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M260.2 186.0 l8 5 l-8 5 z"/><rect class="ai sAi" x="269.2" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tAi" x="287.2" y="152.0" font-size="17" font-weight="700" text-anchor="start">2 · ai-clarify</text><text class="ink" x="287.2" y="188.0" font-size="14" font-weight="400" text-anchor="start">내 말 그래프에서</text><text class="ink" x="287.2" y="212.0" font-size="14" font-weight="400" text-anchor="start">"올려"의 뜻을 찾아요</text><path class="arrow" d="M475.4 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M489.4 186.0 l8 5 l-8 5 z"/><rect class="ai sAi" x="498.4" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tAi" x="516.4" y="152.0" font-size="17" font-weight="700" text-anchor="start">3 · 실행</text><text class="ink" x="516.4" y="188.0" font-size="14" font-weight="400" text-anchor="start">그냥 하거나 · 한 줄 밝히거나</text><text class="ink" x="516.4" y="212.0" font-size="14" font-weight="400" text-anchor="start">· 모르는데 비싸면 물어봐요</text><path class="arrow" d="M704.6 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M718.6 186.0 l8 5 l-8 5 z"/><rect class="you sYou" x="727.6" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tYou" x="745.6" y="152.0" font-size="17" font-weight="700" text-anchor="start">4 · 정정</text><text class="ink" x="745.6" y="188.0" font-size="14" font-weight="400" text-anchor="start">"틀렸어" "왜 그랬어"</text><text class="ink" x="745.6" y="212.0" font-size="14" font-weight="400" text-anchor="start">"물어봤어야지"</text><path class="arrow" d="M933.8 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M947.8 186.0 l8 5 l-8 5 z"/><rect class="ok sOk" x="956.8" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tOk" x="974.8" y="152.0" font-size="17" font-weight="700" text-anchor="start">5 · 기록</text><text class="ink" x="974.8" y="188.0" font-size="14" font-weight="400" text-anchor="start">hear: 말의 진짜 뜻</text><text class="ink" x="974.8" y="212.0" font-size="14" font-weight="400" text-anchor="start">ai-log: 틀어진 전제</text><path class="arrow" d="M1058.4 270.0 V318.0 H370.8 V280.0" stroke-width="2" stroke-dasharray="6 5"/><path class="arrowHead" d="M370.8 270.0 l-6 10 l12 0 z"/><text class="mute" x="714.6" y="308.0" font-size="14" font-weight="400" text-anchor="middle">다음 세션: 서로 다른 날 반복된 뜻과 기준이 처음부터 들어와 있어요</text><rect class="you sYou" x="40.0" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="64.0" y="373.0" font-size="13" font-weight="400" text-anchor="start">나</text><rect class="ai sAi" x="104.7" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="128.7" y="373.0" font-size="13" font-weight="400" text-anchor="start">AI</text><rect class="ok sOk" x="174.4" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="198.4" y="373.0" font-size="13" font-weight="400" text-anchor="start">내 컴퓨터에 쌓이는 기록</text></svg>
