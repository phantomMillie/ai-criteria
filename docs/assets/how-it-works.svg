text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif}
</style><rect class="bg" width="1200" height="400"/><text class="ink" x="40.0" y="52.0" font-size="28" font-weight="700" text-anchor="start">Where one correction goes</text><text class="mute" x="40.0" y="80.0" font-size="15" font-weight="400" text-anchor="start">One correction becomes evidence for the next conversation.</text><rect class="you sYou" x="40.0" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tYou" x="58.0" y="152.0" font-size="17" font-weight="700" text-anchor="start">1 · Instruction</text><text class="ink" x="58.0" y="188.0" font-size="14" font-weight="400" text-anchor="start">"fix the README</text><text class="ink" x="58.0" y="212.0" font-size="14" font-weight="400" text-anchor="start">and push it"</text><path class="arrow" d="M246.2 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M260.2 186.0 l8 5 l-8 5 z"/><rect class="ai sAi" x="269.2" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tAi" x="287.2" y="152.0" font-size="17" font-weight="700" text-anchor="start">2 · ai-clarify</text><text class="ink" x="287.2" y="188.0" font-size="14" font-weight="400" text-anchor="start">looks up what "push it"</text><text class="ink" x="287.2" y="212.0" font-size="14" font-weight="400" text-anchor="start">meant in your words graph</text><path class="arrow" d="M475.4 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M489.4 186.0 l8 5 l-8 5 z"/><rect class="ai sAi" x="498.4" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tAi" x="516.4" y="152.0" font-size="17" font-weight="700" text-anchor="start">3 · Act</text><text class="ink" x="516.4" y="188.0" font-size="14" font-weight="400" text-anchor="start">just do it · state the reading</text><text class="ink" x="516.4" y="212.0" font-size="14" font-weight="400" text-anchor="start">· ask if unknown and costly</text><path class="arrow" d="M704.6 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M718.6 186.0 l8 5 l-8 5 z"/><rect class="you sYou" x="727.6" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tYou" x="745.6" y="152.0" font-size="17" font-weight="700" text-anchor="start">4 · Correction</text><text class="ink" x="745.6" y="188.0" font-size="14" font-weight="400" text-anchor="start">"that's wrong"</text><text class="ink" x="745.6" y="212.0" font-size="14" font-weight="400" text-anchor="start">"why did you"</text><text class="ink" x="745.6" y="236.0" font-size="14" font-weight="400" text-anchor="start">"you should have asked"</text><path class="arrow" d="M933.8 191.0 h14.0" stroke-width="2"/><path class="arrowHead" d="M947.8 186.0 l8 5 l-8 5 z"/><rect class="ok sOk" x="956.8" y="116.0" width="203.2" height="150.0" rx="14" stroke-width="1.2"/><text class="tOk" x="974.8" y="152.0" font-size="17" font-weight="700" text-anchor="start">5 · Record</text><text class="ink" x="974.8" y="188.0" font-size="14" font-weight="400" text-anchor="start">hear: what the word meant</text><text class="ink" x="974.8" y="212.0" font-size="14" font-weight="400" text-anchor="start">ai-log: the broken premise</text><path class="arrow" d="M1058.4 270.0 V318.0 H370.8 V280.0" stroke-width="2" stroke-dasharray="6 5"/><path class="arrowHead" d="M370.8 270.0 l-6 10 l12 0 z"/><text class="mute" x="714.6" y="308.0" font-size="14" font-weight="400" text-anchor="middle">Next session: meanings and criteria repeated on separate days are already in context</text><rect class="you sYou" x="40.0" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="64.0" y="373.0" font-size="13" font-weight="400" text-anchor="start">you</text><rect class="ai sAi" x="113.5" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="137.4" y="373.0" font-size="13" font-weight="400" text-anchor="start">the AI</text><rect class="ok sOk" x="208.5" y="360.0" width="16.0" height="16.0" rx="4" stroke-width="1.2"/><text class="mute" x="232.5" y="373.0" font-size="13" font-weight="400" text-anchor="start">records kept on your machine</text></svg>
