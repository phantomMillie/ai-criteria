<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">내 말 그래프</title><desc id="d">같은 "올려"도 흐름·프로젝트·사람에 따라 뜻이 달라요. 좁은 쪽이 이겨요.</desc><style>
.bg{fill:#ffffff}.ink{fill:#1f2328}.mute{fill:#59636e}.line{stroke:#d0d7de}.card{fill:#f6f8fa}.cardS{stroke:#d0d7de}
.you{fill:#fff4dc}.sYou{stroke:#b07d00}.tYou{fill:#8a6100}
.ai{fill:#eee9ff}.sAi{stroke:#6e56cf}.tAi{fill:#5a43b8}
.ok{fill:#e2f5ea}.sOk{stroke:#1a7f4b}.tOk{fill:#1a7f4b}
.bad{fill:#ffebe9}.sBad{stroke:#cf222e}.tBad{fill:#cf222e}
.arrow{stroke:#8c959f;fill:none}.arrowHead{fill:#8c959f}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.ink{fill:#e6edf3}.mute{fill:#9198a1}.line{stroke:#30363d}.card{fill:#161b22}.cardS{stroke:#30363d}
.you{fill:#2a2210}.sYou{stroke:#e3b341}.tYou{fill:#e3b341}
.ai{fill:#1d1838}.sAi{stroke:#a48bff}.tAi{fill:#b9a6ff}
.ok{fill:#0f2a1c}.sOk{stroke:#3fb96f}.tOk{fill:#3fb96f}
.bad{fill:#2d1215}.sBad{stroke:#ff7b72}.tBad{fill:#ff7b72}
.arrow{stroke:#6e7681}.arrowHead{fill:#6e7681}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif}
</style><rect class="bg" width="1200" height="520"/><text class="ink" x="40.0" y="52.0" font-size="28" font-weight="700" text-anchor="start">내 말 그래프</text><text class="mute" x="40.0" y="80.0" font-size="15" font-weight="400" text-anchor="start">같은 "올려"도 흐름·프로젝트·사람에 따라 뜻이 달라요. 좁은 쪽이 이겨요.</text><circle class="you sYou" cx="170" cy="262" r="70" stroke-width="1.6"/><text class="ink" x="170.0" y="270.0" font-size="24" font-weight="700" text-anchor="middle">올려</text><path class="arrow" d="M240 262 C350 262 330 144.0 432 144.0" stroke-width="1.8"/><path class="arrowHead" d="M440 144.0 l-9 -5 l0 10 z"/><rect class="ai sAi" x="440.0" y="112.0" width="720.0" height="64.0" rx="12" stroke-width="1.2"/><text class="tAi" x="458.0" y="138.0" font-size="14" font-weight="700" text-anchor="start">흐름</text><text class="mute" x="458.0" y="160.0" font-size="13" font-weight="400" text-anchor="start">"보여줘봐" 바로 다음</text><text class="ink" x="640.0" y="151.0" font-size="17" font-weight="600" text-anchor="start">아직 안 올림, 열어서 보여주기</text><rect class="card cardS" x="1094.5" y="130.0" width="49.5" height="28.0" rx="14" stroke-width="1"/><text class="ink" x="1119.3" y="149.0" font-size="13" font-weight="600" text-anchor="middle">잠정</text><path class="arrow" d="M240 262 C350 262 330 226.0 432 226.0" stroke-width="1.8"/><path class="arrowHead" d="M440 226.0 l-9 -5 l0 10 z"/><rect class="ok sOk" x="440.0" y="194.0" width="720.0" height="64.0" rx="12" stroke-width="1.2"/><text class="tOk" x="458.0" y="220.0" font-size="14" font-weight="700" text-anchor="start">프로젝트</text><text class="mute" x="458.0" y="242.0" font-size="13" font-weight="400" text-anchor="start">@my-fork</text><text class="ink" x="640.0" y="233.0" font-size="17" font-weight="600" text-anchor="start">main에 바로 푸시</text><rect class="card cardS" x="1094.5" y="212.0" width="49.5" height="28.0" rx="14" stroke-width="1"/><text class="ink" x="1119.3" y="231.0" font-size="13" font-weight="600" text-anchor="middle">확정</text><path class="arrow" d="M240 262 C350 262 330 308.0 432 308.0" stroke-width="1.8"/><path class="arrowHead" d="M440 308.0 l-9 -5 l0 10 z"/><rect class="ok sOk" x="440.0" y="276.0" width="720.0" height="64.0" rx="12" stroke-width="1.2"/><text class="tOk" x="458.0" y="302.0" font-size="14" font-weight="700" text-anchor="start">프로젝트</text><text class="mute" x="458.0" y="324.0" font-size="13" font-weight="400" text-anchor="start">@work-app</text><text class="ink" x="640.0" y="315.0" font-size="17" font-weight="600" text-anchor="start">브랜치 만들고 PR</text><rect class="card cardS" x="1094.5" y="294.0" width="49.5" height="28.0" rx="14" stroke-width="1"/><text class="ink" x="1119.3" y="313.0" font-size="13" font-weight="600" text-anchor="middle">확정</text><path class="arrow" d="M240 262 C350 262 330 390.0 432 390.0" stroke-width="1.8"/><path class="arrowHead" d="M440 390.0 l-9 -5 l0 10 z"/><rect class="card cardS" x="440.0" y="358.0" width="720.0" height="64.0" rx="12" stroke-width="1.2"/><text class="mute" x="458.0" y="384.0" font-size="14" font-weight="700" text-anchor="start">사람</text><text class="mute" x="458.0" y="406.0" font-size="13" font-weight="400" text-anchor="start">그 밖의 모든 곳</text><text class="ink" x="640.0" y="397.0" font-size="17" font-weight="600" text-anchor="start">커밋하고 푸시</text><rect class="card cardS" x="1094.5" y="376.0" width="49.5" height="28.0" rx="14" stroke-width="1"/><text class="ink" x="1119.3" y="395.0" font-size="13" font-weight="600" text-anchor="middle">잠정</text><text class="ink" x="40.0" y="474.0" font-size="14" font-weight="700" text-anchor="start">찾는 순서  흐름 → 프로젝트 → 사람</text><text class="mute" x="40.0" y="498.0" font-size="13" font-weight="400" text-anchor="start">레이어는 자동으로 정해져요. 바로 앞 단계가 붙으면 흐름, 한 프로젝트면 프로젝트, 두 프로젝트 이상이면 사람.</text></svg>
